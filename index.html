<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D8E0E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2D36" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='4' fill='%23173BCC'/%3E%3Cg fill='%23fff'%3E%3Crect x='9' y='6' width='14' height='6' rx='1.5'/%3E%3Crect x='9' y='15' width='4' height='3' rx='1'/%3E%3Crect x='14' y='15' width='4' height='3' rx='1'/%3E%3Crect x='19' y='15' width='4' height='3' rx='1'/%3E%3Crect x='9' y='20' width='4' height='3' rx='1'/%3E%3Crect x='14' y='20' width='4' height='3' rx='1'/%3E%3Crect x='19' y='20' width='4' height='3' rx='1'/%3E%3Crect x='9' y='25' width='4' height='3' rx='1'/%3E%3Crect x='14' y='25' width='4' height='3' rx='1'/%3E%3Crect x='19' y='25' width='4' height='3' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<title>Shift distance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EDEF;
    --surface: #FFFFFF;
    --ink: #16202A;
    --muted: #56626D;
    --line: #D3D9DE;
    --active: #E1E8FB;
    --tools: #D8E0E5;
    --brand: #173BCC;
    --brand-ink: #FFFFFF;
    --bar: #16202A;
    --bar-ink: #F3F6F7;
    --bar-muted: #A9B5BE;
    --focus: #1F7AE0;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F161B; --surface: #172128; --ink: #E6ECEF; --muted: #95A2AC; --line: #26333C;
      --active: #1A2650; --tools: #1F2D36; --brand: #5A7CF0; --brand-ink: #0B1330;
      --bar: #25333D; --focus: #6AB0FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F161B; --surface: #172128; --ink: #E6ECEF; --muted: #95A2AC; --line: #26333C;
    --active: #1A2650; --tools: #1F2D36; --brand: #5A7CF0; --brand-ink: #0B1330;
    --bar: #25333D; --focus: #6AB0FF;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.4;
    padding-bottom: 7.5rem; /* room for the total bar */
  }
  .wrap { max-width: 36rem; margin: 0 auto; padding: 0 1rem; }

  header {
    padding: 1.5rem 0 0.75rem;
    display: flex; align-items: center; gap: 0.875rem;
    background: var(--tools);
    box-shadow: 0 0 0 100vmax var(--tools);
    clip-path: inset(-100vmax -100vmax 0);
  }
  .brand { flex: none; display: block; border-radius: 50%; }
  .brand img { display: block; width: 7rem; height: 7rem; }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }

  .tools {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--tools);
    box-shadow: 0 0 0 100vmax var(--tools);
    clip-path: inset(0 -100vmax);
    padding: 0.75rem 0;
    display: grid;
    gap: 0.625rem;
  }
  input[type="search"] {
    width: 100%;
    font: inherit;
    padding: 0.75rem 0.875rem;
    border: 1.5px solid var(--line);
    border-radius: 0.625rem;
    background: var(--surface);
    color: var(--ink);
  }
  input[type="search"]::placeholder { color: var(--muted); }

  .mode {
    margin: 0; padding: 0.25rem; border: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem;
    background: var(--surface);
    border-radius: 0.75rem;
  }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode span {
    display: block;
    padding: 0.625rem;
    border-radius: 0.5rem;
    text-align: center;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .mode input:checked + span { background: var(--brand); color: var(--brand-ink); }
  .mode input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.625rem 0.5rem 0.625rem 0.75rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .row[hidden] { display: none; }
  .row.is-active { background: var(--active); box-shadow: inset 4px 0 0 var(--brand); }
  .name { display: block; font-weight: 600; }
  .km { display: block; font-size: 0.875rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .row.is-active .km { color: var(--ink); }

  .stepper { display: flex; align-items: center; gap: 0.25rem; }
  .stepper button {
    width: 3rem; height: 3rem;
    border-radius: 0.625rem;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stepper svg { width: 1.375rem; height: 1.375rem; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
  .stepper button.plus { border-color: var(--brand); color: var(--brand); }
  .row.is-active .stepper button.plus { background: var(--brand); color: var(--brand-ink); }
  .count {
    min-width: 2ch;
    text-align: center;
    font: 600 1.25rem var(--sans);
    font-variant-numeric: tabular-nums;
  }
  .count.bump { animation: bump 160ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.3); } }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .empty { padding: 2rem 0.75rem; color: var(--muted); text-align: center; }
  .empty button { font: inherit; color: var(--brand); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0.25rem; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    background: var(--bar);
    color: var(--bar-ink);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bar .wrap {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding-top: 0.875rem; padding-bottom: 0.875rem;
  }
  .total { font: 600 2.25rem/1.1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .total small { font-size: 1rem; font-weight: 400; margin-left: 0.25rem; }
  .stops { color: var(--bar-muted); font-size: 0.9375rem; }
  .clear {
    font: 600 1rem var(--sans);
    padding: 0.75rem 1rem;
    border-radius: 0.625rem;
    border: 1.5px solid var(--bar-muted);
    background: transparent;
    color: var(--bar-ink);
    cursor: pointer;
  }
  .clear:disabled { opacity: 0.35; cursor: default; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { .count.bump { animation: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://transportunion.com.au/" target="_blank" rel="noopener">
        <img src="logo.png" alt="Independent Transport Union" width="112" height="112">
      </a>
      <div>
        <h1>Shift distance</h1>
        <p>Tap + once for each time a destination appears on your slip.</p>
      </div>
    </header>

    <div class="tools">
      <fieldset class="mode">
        <legend class="sr-only">Each + adds a</legend>
        <label><input type="radio" name="mode" value="ret" checked><span>Return</span></label>
        <label><input type="radio" name="mode" value="one"><span>One way</span></label>
      </fieldset>
      <label class="sr-only" for="search">Search destinations</label>
      <input id="search" type="search" placeholder="Search 55 destinations" autocomplete="off">    </div>

    <ul id="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </div>

  <div class="bar">
    <div class="wrap">
      <div aria-live="polite">
        <div class="total"><span id="total">0.000</span><small>km</small></div>
        <div class="stops" id="stops">No stops added</div>
      </div>
      <button class="clear" id="clear" type="button" disabled>Clear all</button>
    </div>
  </div>

<script>
// ---------------------------------------------------------------
// The destination list. Edit this array and nothing else.
// km can have up to 3 decimal places.
// ---------------------------------------------------------------
const DESTINATIONS = [
  { name: "Alamein", km: 29.778},
  { name: "Bayswater", km: 59.056},
  { name: "Belgrave", km: 82.602},
  { name: "Blackburn", km: 34.884},
  { name: "Brighton Beach", km: 29.474},
  { name: "Broadmeadows", km: 36.160},
  { name: "Burnley Loop", km: 6.534},
  { name: "Camberwell", km: 17.946},
  { name: "Camberwell-Alamein", km: 11.832},
  { name: "Carrum", km: 69.728},
  { name: "Caulfield Loop", km: 6.534},
  { name: "Cheltenham", km: 42.168},
  { name: "City Circle", km: 5.588},
  { name: "Clifton Hill Loop", km: 4.314},
  { name: "Craigieburn", km: 54.660},
  { name: "Cranbourne", km: 86.922},
  { name: "Dandenong", km: 59.066},
  { name: "Dandenong-Cranbourne", km: 27.856},
  { name: "Dandenong-East Pakenham", km: 57.666},
  { name: "East Pakenham", km: 116.732},
  { name: "Eltham", km: 52.314},
  { name: "Flemington", km: 17.405},
  { name: "Frankston", km: 85.382},
  { name: "Frankston-Stony Point", km: 61.330},
  { name: "Glen Waverley", km: 41.986},
  { name: "Hurstbridge", km: 73.574},
  { name: "Laverton via", km: 44.474},
  { name: "Laverton via", km: 46.804},
  { name: "Lilydale", km: 75.256},
  { name: "Macaulay", km: 7.240},
  { name: "Macleod", km: 32.956},
  { name: "Melbourne Yard", km: 5.824},
  { name: "Mernda", km: 63.670},
  { name: "Moorabbin", km: 34.428},
  { name: "Mooroolbark", km: 66.496},
  { name: "Mordialloc", km: 52.922},
  { name: "Newport", km: 23.574},
  { name: "Newport-Laverton", km: 23.230},
  { name: "Newport-Williamstown", km: 7.298},
  { name: "North Melbourne", km: 6.624},
  { name: "Northern Loop", km: 4.712},
  { name: "Ringwood", km: 49.048},
  { name: "Riversdale", km: 21.002},
  { name: "Sandringham", km: 35.862},
  { name: "Showgrounds", km: 15.695},
  { name: "Sunbury", km: 80.160},
  { name: "Upfield", km: 40.176},
  { name: "Upper Ferntree", km: 72.862},
  { name: "Watergardens", km: 50.160},
  { name: "Werribee via", km: 65.944},
  { name: "Werribee via", km: 68.274},
  { name: "West Footscray", km: 18.252},
  { name: "Westall", km: 41.954},
  { name: "Williamstown", km: 30.872},
];

// Work in whole metres so 3-decimal km values add up exactly
// (floating point would otherwise drift, e.g. 0.1 + 0.2).
// Distances are return trips; a one-way trip counts as half.
const items = DESTINATIONS.map((d, i) => ({
  i, name: d.name, m: Math.round(d.km * 1000), ret: 0, one: 0, el: {}
}));
const formatKm = m => (m / 1000).toFixed(3);
// Sum in half-metres so odd one-way halves stay exact; round only for display.
const halves = it => it.ret * it.m * 2 + it.one * it.m;
const halvesToKm = h => formatKm(Math.round(h / 2));

let mode = "ret"; // which count + and − change: "ret" or "one"

const list = document.getElementById("list");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
const totalEl = document.getElementById("total");
const stopsEl = document.getElementById("stops");
const clearBtn = document.getElementById("clear");

search.placeholder = `Search ${items.length} destinations`;

// Build every row once; filtering just hides/shows them.
for (const it of items) {
  const li = document.createElement("li");
  li.className = "row";
  li.dataset.i = it.i;

  const info = document.createElement("div");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = it.name;
  const km = document.createElement("span");
  km.className = "km";
  info.append(name, km);

  const stepper = document.createElement("div");
  stepper.className = "stepper";
  const minus = document.createElement("button");
  minus.type = "button"; minus.className = "minus"; minus.dataset.step = "-1";
  minus.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>';
  const count = document.createElement("span");
  count.className = "count";
  const plus = document.createElement("button");
  plus.type = "button"; plus.className = "plus"; plus.dataset.step = "1";
  plus.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  stepper.append(minus, count, plus);

  li.append(info, stepper);
  list.append(li);
  it.el = { li, km, minus, count, plus };
  renderRow(it);
}

function renderRow(it) {
  const { li, km, minus, count, plus } = it.el;
  const n = it[mode];
  const trip = mode === "one" ? "one-way trip" : "return trip";
  count.textContent = n;
  // The count and − reflect the current mode; the highlight reflects either.
  count.style.visibility = minus.style.visibility = n > 0 ? "visible" : "hidden";
  minus.disabled = n === 0;
  minus.setAttribute("aria-label", `Remove a ${trip} to ${it.name}`);
  plus.setAttribute("aria-label", `Add a ${trip} to ${it.name}`);
  li.classList.toggle("is-active", it.ret + it.one > 0);

  if (it.ret + it.one === 0) {
    km.textContent = mode === "one"
      ? `${halvesToKm(it.m)} km one way`
      : `${formatKm(it.m)} km`;
  } else if (it.one === 0) {
    km.textContent = it.ret > 1
      ? `${formatKm(it.m)} × ${it.ret} = ${formatKm(it.m * it.ret)} km`
      : `${formatKm(it.m)} km`;
  } else {
    const parts = [];
    if (it.ret) parts.push(`${it.ret} return`);
    parts.push(`${it.one} one way`);
    km.textContent = `${parts.join(" + ")} = ${halvesToKm(halves(it))} km`;
  }
}

function renderTotal() {
  let h = 0, stops = 0, oneWay = 0;
  for (const it of items) { h += halves(it); stops += it.ret + it.one; oneWay += it.one; }
  totalEl.textContent = halvesToKm(h);
  stopsEl.textContent = stops === 0 ? "No stops added"
    : `${stops} stop${stops === 1 ? "" : "s"}${oneWay ? ` (${oneWay} one way)` : ""}`;
  clearBtn.disabled = stops === 0;
}

function setMode(next) {
  mode = next;
  document.querySelector(`.mode input[value="${next}"]`).checked = true;
  for (const it of items) renderRow(it);
}

function applyFilter() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  for (const it of items) {
    const match = it.name.toLowerCase().includes(q);
    it.el.li.hidden = !match;
    if (match) shown++;
  }
  empty.hidden = shown > 0;
  if (shown === 0) {
    empty.textContent = `No destinations match “${search.value.trim()}”. `;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Clear search";
    b.addEventListener("click", () => { search.value = ""; applyFilter(); search.focus(); });
    empty.append(b);
  }
}

list.addEventListener("click", e => {
  const btn = e.target.closest("button[data-step]");
  if (!btn) return;
  const it = items[btn.closest(".row").dataset.i];
  it[mode] = Math.max(0, it[mode] + Number(btn.dataset.step));
  renderRow(it);
  renderTotal();
  if (it[mode] === 0 && btn === it.el.minus) it.el.plus.focus();
  const c = it.el.count;
  c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
});

search.addEventListener("input", applyFilter);

document.querySelector(".mode").addEventListener("change", e => setMode(e.target.value));

// A cleared slip starts again in Return, since most trips are returns.
clearBtn.addEventListener("click", () => {
  for (const it of items) { it.ret = 0; it.one = 0; }
  setMode("ret");
  renderTotal();
});

renderTotal();
</script>
</body>
</html>
