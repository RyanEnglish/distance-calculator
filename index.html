<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift distance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EDEF;
    --surface: #FFFFFF;
    --ink: #16202A;
    --muted: #56626D;
    --line: #D3D9DE;
    --accent: #0E6B57;
    --accent-ink: #FFFFFF;
    --active: #DCEFE8;
    --bar: #16202A;
    --bar-ink: #F3F6F7;
    --bar-muted: #A9B5BE;
    --focus: #1F7AE0;
    --sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F161B; --surface: #172128; --ink: #E6ECEF; --muted: #95A2AC; --line: #26333C;
      --accent: #3FB594; --accent-ink: #07130F; --active: #173A31;
      --bar: #25333D; --bar-ink: #F3F6F7; --bar-muted: #A9B5BE; --focus: #6AB0FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F161B; --surface: #172128; --ink: #E6ECEF; --muted: #95A2AC; --line: #26333C;
    --accent: #3FB594; --accent-ink: #07130F; --active: #173A31;
    --bar: #25333D; --bar-ink: #F3F6F7; --bar-muted: #A9B5BE; --focus: #6AB0FF;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.4;
    padding-bottom: 7.5rem; /* room for the total bar */
  }
  .wrap { max-width: 36rem; margin: 0 auto; padding: 0 1rem; }

  header { padding: 1.5rem 0 0.75rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }

  .tools {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--bg);
    padding: 0.75rem 0;
    display: grid;
    gap: 0.625rem;
  }
  input[type="search"] {
    width: 100%;
    font: inherit;
    padding: 0.75rem 0.875rem;
    border: 1.5px solid var(--line);
    border-radius: 0.625rem;
    background: var(--surface);
    color: var(--ink);
  }
  input[type="search"]::placeholder { color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted); cursor: pointer; width: fit-content; }
  .toggle input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); margin: 0; }

  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.625rem 0.5rem 0.625rem 0.75rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .row.is-active { background: var(--active); }
  .name { display: block; font-weight: 600; }
  .km { display: block; font-family: var(--mono); font-size: 0.875rem; color: var(--muted); }
  .row.is-active .km { color: var(--ink); }

  .stepper { display: flex; align-items: center; gap: 0.25rem; }
  .stepper button {
    width: 3rem; height: 3rem;
    border-radius: 0.625rem;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 600 1.5rem/1 var(--sans);
    cursor: pointer;
    touch-action: manipulation;
  }
  .stepper button.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .count {
    min-width: 2ch;
    text-align: center;
    font: 600 1.25rem var(--mono);
  }
  .count.bump { animation: bump 160ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.3); } }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .empty { padding: 2rem 0.75rem; color: var(--muted); text-align: center; }
  .empty button { font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0.25rem; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    background: var(--bar);
    color: var(--bar-ink);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bar .wrap {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding-top: 0.875rem; padding-bottom: 0.875rem;
  }
  .total { font: 600 2.25rem/1.1 var(--mono); letter-spacing: -0.02em; }
  .total small { font-size: 1rem; font-weight: 400; margin-left: 0.25rem; }
  .stops { color: var(--bar-muted); font-size: 0.9375rem; }
  .clear {
    font: 600 1rem var(--sans);
    padding: 0.75rem 1rem;
    border-radius: 0.625rem;
    border: 1.5px solid var(--bar-muted);
    background: transparent;
    color: var(--bar-ink);
    cursor: pointer;
  }
  .clear:disabled { opacity: 0.35; cursor: default; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { .count.bump { animation: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Shift distance</h1>
      <p>Tap + once for each time a destination appears on your slip.</p>
    </header>

    <div class="tools">
      <label class="sr-only" for="search">Search destinations</label>
      <input id="search" type="search" placeholder="Search 55 destinations" autocomplete="off">
      <label class="toggle"><input id="onlyAdded" type="checkbox"> Show only added</label>
    </div>

    <ul id="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </div>

  <div class="bar">
    <div class="wrap">
      <div aria-live="polite">
        <div class="total"><span id="total">0.000</span><small>km</small></div>
        <div class="stops" id="stops">No stops added</div>
      </div>
      <button class="clear" id="clear" type="button" disabled>Clear all</button>
    </div>
  </div>

<script>
// ---------------------------------------------------------------
// The destination list. Edit this array and nothing else.
// km can have up to 3 decimal places.
// ---------------------------------------------------------------
const DESTINATIONS = [
  { name: "Airport Freight Terminal",   km: 38.412 },
  { name: "Ashgrove Clinic",            km: 7.905 },
  { name: "Bayview Warehouse",          km: 14.260 },
  { name: "Beacon Hill Depot",          km: 22.118 },
  { name: "Birchwood Mall",             km: 9.734 },
  { name: "Bridgeport Yard",            km: 31.057 },
  { name: "Brookside School",           km: 5.482 },
  { name: "Calder Park Store",          km: 27.690 },
  { name: "Cannery Row Offices",        km: 12.341 },
  { name: "Cedar Flats",                km: 18.876 },
  { name: "Central Library",            km: 3.215 },
  { name: "Clifton Station",            km: 11.009 },
  { name: "Coastal Distribution",       km: 44.530 },
  { name: "Coral Street Pharmacy",      km: 6.127 },
  { name: "Crestwood Hospital",         km: 16.748 },
  { name: "Dockside Cold Store",        km: 13.902 },
  { name: "Eastgate Plaza",             km: 8.664 },
  { name: "Elm Court Aged Care",        km: 10.385 },
  { name: "Fairfield Markets",          km: 4.971 },
  { name: "Fernhill Primary",           km: 19.253 },
  { name: "Foundry Lane",               km: 7.118 },
  { name: "Garden Point Kiosk",         km: 25.407 },
  { name: "Glenview Medical",           km: 15.836 },
  { name: "Granite Quarry Office",      km: 52.214 },
  { name: "Harbour Master",             km: 12.990 },
  { name: "Hawthorn Ridge",             km: 21.573 },
  { name: "Highfield Estate",           km: 17.302 },
  { name: "Hilltop Reservoir",          km: 33.845 },
  { name: "Ironbark Industrial",        km: 28.061 },
  { name: "Juniper Close",              km: 6.790 },
  { name: "Kingsway Retail Park",       km: 11.456 },
  { name: "Lakeside Pavilion",          km: 20.128 },
  { name: "Laurel Bank Depot",          km: 24.667 },
  { name: "Lighthouse Point",           km: 41.093 },
  { name: "Maple Grove Centre",         km: 9.211 },
  { name: "Marina North",               km: 14.874 },
  { name: "Meadowbank Farm Gate",       km: 47.326 },
  { name: "Mill Road Workshop",         km: 8.049 },
  { name: "Northern Substation",        km: 35.518 },
  { name: "Oakleigh Terrace",           km: 10.902 },
  { name: "Orchard Hill",               km: 26.385 },
  { name: "Park Lane Hotel",            km: 4.307 },
  { name: "Pinecrest Laboratory",       km: 18.140 },
  { name: "Quarry Bend",                km: 49.772 },
  { name: "Queens Wharf",               km: 13.268 },
  { name: "Railway Goods Shed",         km: 15.093 },
  { name: "Redgum Community Hall",      km: 23.451 },
  { name: "Riverbend Council Office",   km: 12.006 },
  { name: "Rosewood Clinic",            km: 9.587 },
  { name: "Saltmarsh Treatment Plant",  km: 37.660 },
  { name: "Southern Hub",               km: 29.914 },
  { name: "Stonebridge Garage",         km: 16.235 },
  { name: "Sunnyside Kindergarten",     km: 5.839 },
  { name: "Tallow Creek Pump Station",  km: 43.127 },
  { name: "Westfield Business Park",    km: 19.480 },
];

// Work in whole metres so 3-decimal km values add up exactly
// (floating point would otherwise drift, e.g. 0.1 + 0.2).
const items = DESTINATIONS.map((d, i) => ({
  i, name: d.name, m: Math.round(d.km * 1000), count: 0, el: {}
}));
const formatKm = m => (m / 1000).toFixed(3);

const list = document.getElementById("list");
const search = document.getElementById("search");
const onlyAdded = document.getElementById("onlyAdded");
const empty = document.getElementById("empty");
const totalEl = document.getElementById("total");
const stopsEl = document.getElementById("stops");
const clearBtn = document.getElementById("clear");

search.placeholder = `Search ${items.length} destinations`;

// Build every row once; filtering just hides/shows them.
for (const it of items) {
  const li = document.createElement("li");
  li.className = "row";
  li.dataset.i = it.i;

  const info = document.createElement("div");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = it.name;
  const km = document.createElement("span");
  km.className = "km";
  info.append(name, km);

  const stepper = document.createElement("div");
  stepper.className = "stepper";
  const minus = document.createElement("button");
  minus.type = "button"; minus.className = "minus"; minus.dataset.step = "-1";
  minus.textContent = "−";
  const count = document.createElement("span");
  count.className = "count";
  const plus = document.createElement("button");
  plus.type = "button"; plus.className = "plus"; plus.dataset.step = "1";
  plus.textContent = "+";
  plus.setAttribute("aria-label", `Add a visit to ${it.name}`);
  stepper.append(minus, count, plus);

  li.append(info, stepper);
  list.append(li);
  it.el = { li, km, minus, count };
  renderRow(it);
}

function renderRow(it) {
  const { li, km, minus, count } = it.el;
  count.textContent = it.count;
  minus.disabled = it.count === 0;
  minus.setAttribute("aria-label", `Remove a visit to ${it.name}`);
  li.classList.toggle("is-active", it.count > 0);
  km.textContent = it.count > 1
    ? `${formatKm(it.m)} × ${it.count} = ${formatKm(it.m * it.count)} km`
    : `${formatKm(it.m)} km`;
}

function renderTotal() {
  let m = 0, stops = 0;
  for (const it of items) { m += it.m * it.count; stops += it.count; }
  totalEl.textContent = formatKm(m);
  stopsEl.textContent = stops === 0 ? "No stops added" : `${stops} stop${stops === 1 ? "" : "s"}`;
  clearBtn.disabled = stops === 0;
}

function applyFilter() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  for (const it of items) {
    const match = it.name.toLowerCase().includes(q) && (!onlyAdded.checked || it.count > 0);
    it.el.li.hidden = !match;
    if (match) shown++;
  }
  empty.hidden = shown > 0;
  if (shown === 0) {
    empty.textContent = "";
    if (onlyAdded.checked && !q) {
      empty.textContent = "Nothing added yet. Untick “Show only added” to see every destination.";
    } else {
      empty.append(`No destinations match “${search.value.trim()}”. `);
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Clear search";
      b.addEventListener("click", () => { search.value = ""; applyFilter(); search.focus(); });
      empty.append(b);
    }
  }
}

list.addEventListener("click", e => {
  const btn = e.target.closest("button[data-step]");
  if (!btn) return;
  const it = items[btn.closest(".row").dataset.i];
  it.count = Math.max(0, it.count + Number(btn.dataset.step));
  renderRow(it);
  renderTotal();
  const c = it.el.count;
  c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
});

search.addEventListener("input", applyFilter);
onlyAdded.addEventListener("change", applyFilter);

clearBtn.addEventListener("click", () => {
  for (const it of items) { it.count = 0; renderRow(it); }
  renderTotal();
  applyFilter();
});

renderTotal();
</script>
</body>
</html>
